  <aside class="preview-intro">
    <span class="eyebrow">VEHICLE NOTE / UI 01</span>
    <h1>내 차를 오래,<br>기록은 가볍게.</h1>
    <p>다가오는 정비부터 지난 기록까지.<br>필요한 순간에, 필요한 만큼만.</p>
    <div class="preview-info"><span class="preview-dot"></span>그림이 아닌 실제 화면 코드</div>
    <p class="preview-caption">오른쪽 화면을 직접 눌러보세요.<br>차량 전환 · 정비 상세 · 주행거리 입력</p>
    <div class="swatches" aria-label="미색, 청록, 옅은 주황 디자인 색상"><i></i><i></i><i></i></div>

  <div class="app-shell">
